<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#1e120a" />
      <stop offset="55%" stop-color="#07090b" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B1A" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FF6B1A" stop-opacity="0.0" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="transparent" />
      <rect y="2" width="6" height="1" fill="#FF6B1A" fill-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" rx="200" fill="url(#bgGlow)" />
  <rect width="1000" height="1000" rx="200" fill="url(#scanlines)" />
  <rect width="1000" height="1000" rx="200" fill="url(#scan)" />

  <!-- Subtle border -->
  <rect x="8" y="8" width="984" height="984" rx="192" fill="none" stroke="#2a1d11" stroke-width="2" />

  <!-- Corner traffic lights (window chrome callback) -->
  <g transform="translate(120,140)">
    <circle cx="0"  cy="0" r="18" fill="#ff5f57" opacity="0.9" />
    <circle cx="48" cy="0" r="18" fill="#febc2e" opacity="0.9" />
    <circle cx="96" cy="0" r="18" fill="#28c840" opacity="0.9" />
  </g>

  <!-- Main glyph: > _ (centered, no text labels) -->
  <g filter="url(#softGlow)">
    <text x="500" y="620"
          font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace"
          font-size="560"
          font-weight="700"
          text-anchor="middle"
          fill="#FF6B1A"
          letter-spacing="-30">&gt;_</text>
  </g>

  <!-- Very subtle vignette ring -->
  <circle cx="500" cy="500" r="486" fill="none" stroke="#1a1109" stroke-width="2" opacity="0.6" />
</svg>
