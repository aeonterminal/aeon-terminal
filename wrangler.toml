#:schema node_modules/wrangler/config-schema.json
name = "aeon-terminal"
compatibility_date = "2025-05-01"
main = "worker.js"

[assets]
binding = "ASSETS"
directory = "./out"
not_found_handling = "404-page"
run_worker_first = true

# Per-user state lives in Cloudflare D1 (SQLite). The worker calls
# ensureSchema() on first use, so no manual migrations are required.
[[d1_databases]]
binding = "DB"
database_name = "aeon_terminal"
database_id = "3dc3f1e5-eef7-46e2-a374-11a1cdc98be4"

# Secrets configured via Cloudflare dashboard (Settings → Variables and Secrets):
#   ANTHROPIC_API_KEY — Claude API key
#   X_CLIENT_ID       — X (Twitter) OAuth 2.0 client id
#   X_CLIENT_SECRET   — X (Twitter) OAuth 2.0 client secret
#   SESSION_SECRET    — random 32-byte hex for cookie HMAC (optional, generated if missing)

# Legacy KV binding (no longer used; left as comment for reference):
#   AEON_MEMORY — KV namespace, replaced by D1.
