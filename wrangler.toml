#:schema node_modules/wrangler/config-schema.json
name = "aeon-terminal"
compatibility_date = "2025-05-01"
main = "worker.js"

[assets]
binding = "ASSETS"
directory = "./out"
not_found_handling = "404-page"
run_worker_first = true

# Optional binding (configured via Cloudflare dashboard, not declared here so
# Git-based deploys don't fail on a missing namespace id):
#   AEON_MEMORY — KV namespace for per-session memory.
# The Worker reads/writes this binding only if it is present; it degrades to
# stateless mode otherwise. See README for setup steps.
