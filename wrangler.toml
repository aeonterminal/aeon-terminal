#:schema node_modules/wrangler/config-schema.json
name = "aeon-terminal"
compatibility_date = "2025-05-01"
main = "worker.js"

[assets]
binding = "ASSETS"
directory = "./out"
not_found_handling = "404-page"
run_worker_first = true

# Per-user state lives in Cloudflare D1 (SQLite). The worker calls
# ensureSchema() on first use, so no manual migrations are required.
[[d1_databases]]
binding = "DB"
database_name = "aeon_terminal"
database_id = "60b9c5d6-151e-4971-a78c-22a24617ff58"

# Secrets configured via Cloudflare dashboard (Settings → Variables and Secrets):
#   ANTHROPIC_API_KEY     — Claude API key
#   GOOGLE_CLIENT_ID      — Google OAuth 2.0 client id
#   GOOGLE_CLIENT_SECRET  — Google OAuth 2.0 client secret
#   GITHUB_CLIENT_ID      — GitHub OAuth 2.0 client id
#   GITHUB_CLIENT_SECRET  — GitHub OAuth 2.0 client secret
#   RESEND_API_KEY        — Resend API key for email magic links
#   EMAIL_FROM            — (optional) From address, defaults to "Aeon Terminal <login@aeonterminal.org>"
